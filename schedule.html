<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>スケジュール | むいぴー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root{ --jp:"DotGothic16","MS Gothic",monospace; --px:"Press Start 2P",var(--jp); }
  *{box-sizing:border-box}
  html,body{margin:0;background:#070b18;color:#cfe0f2}
  body{font-family:var(--jp);padding:0 14px 40px}
  a{color:#7fc4ff}

  /* ---------- site nav ---------- */
  .site{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;
        max-width:1000px;margin:0 auto;padding:16px 0 10px;border-bottom:1px solid #1c2a45}
  .site .brand{font-family:var(--px);font-size:11px;color:#cfe0f2;letter-spacing:1px}
  .site .brand small{display:block;margin-top:6px;color:#7f9db8;font-size:9px}
  .site nav{display:flex;flex-wrap:wrap;gap:8px}
  .site nav a{font-family:var(--px);font-size:10px;text-decoration:none;color:#9db4cc;
        background:#132038;border:1px solid #2a3f60;border-radius:4px;padding:8px 10px}
  .site nav a:hover{background:#1b2c4c;color:#eaf2ff}
  .site nav a[aria-current]{background:#2f5c9b;color:#fff;border-color:#4a90d9}

  .page{max-width:1000px;margin:0 auto}
  h2.sec{font-family:var(--px);font-size:11px;color:#7f9db8;margin:22px 0 10px;letter-spacing:1px}

  /* ---------- week picker / downloads ---------- */
  .panel{background:#0b1224;border:1px solid #1f2f4d;border-radius:8px;padding:12px}
  .weeks{display:flex;flex-wrap:wrap;gap:10px}
  .wk{display:flex;align-items:stretch;border:1px solid #2a3f60;border-radius:6px;overflow:hidden;background:#132038}
  .wk.on{border-color:#4a90d9;box-shadow:0 0 0 1px #4a90d9 inset}
  .wk .pick{font-family:var(--jp);font-size:15px;color:#cfe0f2;background:transparent;border:0;cursor:pointer;
            padding:9px 12px;text-align:left;line-height:1.35}
  .wk.on .pick{background:#2f5c9b;color:#fff}
  .wk .pick em{display:block;font-family:var(--px);font-size:8px;color:#8fd0ff;font-style:normal;margin-top:4px}
  .wk .dl{font-family:var(--px);font-size:9px;cursor:pointer;border:0;border-left:1px solid #2a3f60;
          background:#182b49;color:#9fe0b4;padding:0 12px}
  .wk .dl:hover{background:#21406c;color:#fff}
  .wk.on .dl{border-left-color:#4a90d9}

  /* ---------- toolbar ---------- */
  .bar{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin:14px 0 10px;
       font-family:var(--px);font-size:10px;color:#7f9db8}
  .bar b{color:#cfe0f2;margin-right:6px}
  .bar button{font-family:var(--px);font-size:10px;padding:6px 9px;cursor:pointer;
       background:#132038;color:#9db4cc;border:1px solid #2a3f60;border-radius:4px}
  .bar button:hover{background:#1b2c4c;color:#eaf2ff}
  .bar button.on{background:#2f5c9b;color:#fff;border-color:#4a90d9}
  .hud{font-family:var(--px);font-size:10px;color:#7f9db8}
  .ok{color:#9fe0b4}.err{color:#ff9aa9}

  /* ---------- stage shell ---------- */
  .wrap{position:relative;width:100%;overflow:hidden;border-radius:6px;
        outline:2px solid #4a90d9;box-shadow:0 10px 34px rgba(0,0,0,.55)}
  .wrap.raw{width:1600px;max-width:none;overflow:visible}
  .rawscroll{overflow-x:auto}
  .stage{position:relative;width:1600px;height:900px;transform-origin:0 0;
         background:linear-gradient(160deg,#0a1026 0%,#0d1530 55%,#101b3a 100%);overflow:hidden}
